openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WeMe Signalpilot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: signals
  - name: candidates
  - name: crm
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get signal dashboard summary
      responses:
        "200":
          description: Signal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/refresh:
    post:
      operationId: refreshDashboard
      tags: [dashboard]
      summary: Refresh pilot sources and signals
      responses:
        "200":
          description: Refreshed signal dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "500":
          description: Pilot source refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: List signals
      parameters:
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Strength"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
  /signals/{id}:
    get:
      operationId: getSignal
      tags: [signals]
      summary: Get a signal
      parameters:
        - $ref: "#/components/parameters/SignalId"
      responses:
        "200":
          description: Signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "404":
          $ref: "#/components/responses/NotFound"
  /signals/{id}/review:
    post:
      operationId: reviewSignal
      tags: [signals]
      summary: Review a signal
      parameters:
        - $ref: "#/components/parameters/SignalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalReviewInput"
      responses:
        "200":
          description: Reviewed signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "404":
          $ref: "#/components/responses/NotFound"
  /signals/{id}/evidence:
    post:
      operationId: addSignalEvidence
      tags: [signals]
      summary: Add and verify a public source to a signal
      parameters:
        - $ref: "#/components/parameters/SignalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Verified evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /signals/import:
    post:
      operationId: importSignalBatch
      tags: [signals]
      summary: Import selected accounts from a baseline or CRM workbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signals]
              properties:
                signals:
                  type: array
                  items:
                    $ref: "#/components/schemas/SignalImportInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [imported, skipped]
                properties:
                  imported: { type: number }
                  skipped: { type: number }
                  warnings:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
  /signals/{id}/crm-task:
    post:
      operationId: createCrmTask
      tags: [crm]
      summary: Create a CRM note and task for an approved signal
      parameters:
        - $ref: "#/components/parameters/SignalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmTaskInput"
      responses:
        "201":
          description: CRM task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmTaskResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: CRM service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /crm/contacts/search:
    get:
      operationId: searchCrmContacts
      tags: [crm]
      summary: Search CRM contacts without writing
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: companyDomain
          in: query
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        "200":
          description: CRM contact candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmContactCandidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadRequest" }
  /signals/{id}/crm-contact:
    post:
      operationId: verifySignalCrmContact
      tags: [crm]
      summary: Verify and attach a CRM contact to a signal
      parameters:
        - $ref: "#/components/parameters/SignalId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmContactSelectionInput" }
      responses:
        "200":
          description: Signal with verified CRM contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadRequest" }
  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List the normalized candidate universe
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: view
          in: query
          schema: { type: string, enum: [universe, monitoring, review] }
        - name: relevanceStatus
          in: query
          schema: { type: string, enum: [relevant, possible, not_relevant, needs_review] }
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /candidates/{id}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get one candidate with source snapshots and evidence
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: Candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /candidates/import:
    post:
      operationId: importCandidateSnapshots
      tags: [candidates]
      summary: Import D&B/Bisnode or Sales Navigator snapshot rows
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateImportInput" }
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /candidates/{id}/evidence:
    post:
      operationId: addCandidateEvidence
      tags: [candidates]
      summary: Add and URL-check a public source for a candidate
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceInput" }
      responses:
        "201":
          description: Candidate with the new evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /candidates/{id}/relevance:
    patch:
      operationId: updateCandidateRelevance
      tags: [candidates]
      summary: Set a manual relevance decision for a candidate
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateRelevanceInput" }
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /candidates/{id}/monitoring:
    patch:
      operationId: updateCandidateMonitoring
      tags: [candidates]
      summary: Add or remove a candidate from monitoring without deleting its history
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateMonitoringInput" }
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /candidates/analysis-batches:
    post:
      operationId: createCandidateAnalysisBatch
      tags: [candidates]
      summary: Select a explainable manual analysis batch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateBatchInput" }
      responses:
        "201":
          description: Analysis batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateAnalysisBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
components:
  parameters:
    SignalId:
      name: id
      in: path
      required: true
      schema:
        type: number
    CandidateId:
      name: id
      in: path
      required: true
      schema:
        type: number
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [til_vurdering, godkjent, avvist, allerede_kjent, følg_videre]
    Strength:
      name: strength
      in: query
      schema:
        type: string
        enum: [A, B, C]
    Search:
      name: search
      in: query
      schema:
        type: string
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Contact:
      type: object
      required: [id, name, title, confidence]
      properties:
        id: { type: number }
        crmContactId: { type: ["number", "null"] }
        name: { type: string }
        title: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        linkedinUrl: { type: ["string", "null"] }
        confidence:
          type: string
          enum: [bekreftet, fra_crm, fra_sales_navigator, ikke_verifisert]
        rationale: { type: string }
    Evidence:
      type: object
      required: [title, url, sourceType, publishedAt, excerpt, verificationStatus, verifiedAt]
      properties:
        title: { type: string }
        url: { type: string }
        sourceType: { type: string }
        publishedAt: { type: string, format: date }
        excerpt: { type: string }
        verificationStatus: { type: string, enum: [url_verified] }
        verifiedAt: { type: string, format: date-time }
    SignalCrm:
      type: object
      required: [status, matchCount]
      properties:
        status: { type: string }
        matchCount: { type: number }
        note: { type: ["string", "null"] }
        writeStatus: { type: string, enum: [not_started, pending, completed, partial, failed] }
        crmContactId: { type: ["number", "null"] }
        noteCreatedAt: { type: ["string", "null"], format: date-time }
        taskCreatedAt: { type: ["string", "null"], format: date-time }
        taskId: { type: ["number", "null"] }
    EvidenceInput:
      type: object
      required: [title, url, sourceType, publishedAt, excerpt]
      properties:
        title: { type: string }
        url: { type: string }
        sourceType: { type: string }
        publishedAt: { type: string, format: date }
        excerpt: { type: string }
    SignalImportInput:
      type: object
      required: [companyName, employees, industry, domain, signalType, strength, summary, rationale, publishedAt, evidence, contacts, crm, suggestedOpening, dialogueDraft]
      properties:
        companyName: { type: string }
        employees: { type: number }
        industry: { type: string }
        domain: { type: string }
        signalType: { type: string }
        strength: { type: string, enum: [A, B, C] }
        summary: { type: string }
        rationale: { type: string }
        publishedAt: { type: string, format: date }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceInput" }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/Contact" }
        crm: { $ref: "#/components/schemas/SignalCrm" }
        suggestedOpening: { type: string }
        dialogueDraft: { type: string }
    Signal:
      type: object
      required: [id, company, signalType, strength, status, summary, evidence, contacts, crm]
      properties:
        id: { type: number }
        company:
          type: object
          required: [name, employees, industry, domain]
          properties:
            name: { type: string }
            employees: { type: number }
            industry: { type: string }
            domain: { type: string }
        signalType: { type: string }
        strength:
          type: string
          enum: [A, B, C]
        status:
          type: string
          enum: [til_vurdering, godkjent, avvist, allerede_kjent, følg_videre]
        summary: { type: string }
        rationale: { type: string }
        publishedAt: { type: string, format: date }
        freshnessDays: { type: number }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        crm:
          $ref: "#/components/schemas/SignalCrm"
        suggestedOpening: { type: string }
        dialogueDraft: { type: string }
        reviewReason: { type: ["string", "null"] }
        reviewComment: { type: ["string", "null"] }
    SignalReviewInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [til_vurdering, godkjent, avvist, allerede_kjent, følg_videre]
        reason:
          type: ["string", "null"]
        comment:
          type: ["string", "null"]
    CrmTaskInput:
      type: object
      required: [contactId, dueDate]
      properties:
        contactId: { type: number }
        dueDate: { type: string, format: date }
    CrmTaskResult:
      type: object
      required: [signalId, crmContactId, crmNoteCreated, crmTaskCreated]
      properties:
        signalId: { type: number }
        crmContactId: { type: number }
        crmNoteCreated: { type: boolean }
        crmTaskCreated: { type: boolean }
        taskId: { type: ["number", "null"] }
    CrmContactCandidate:
      type: object
      required: [id, name, title, email, phone, companyName, companyDomain]
      properties:
        id: { type: number }
        name: { type: string }
        title: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        companyName: { type: ["string", "null"] }
        companyDomain: { type: ["string", "null"] }
    CrmContactSelectionInput:
      type: object
      required: [contactId, crmContactId]
      properties:
        contactId: { type: number }
        crmContactId: { type: number }
    DashboardSummary:
      type: object
      required: [total, pending, approved, highPriority, crmTasks, pilotSourcesLastRefreshedAt, rejectedPilotSources]
      properties:
        total: { type: number }
        pending: { type: number }
        approved: { type: number }
        highPriority: { type: number }
        crmTasks: { type: number }
        pilotSourcesLastRefreshedAt: { type: string, format: date-time }
        rejectedPilotSources:
          type: array
          items:
            type: object
            required: [company, url, reason]
            properties:
              company: { type: string }
              url: { type: string }
              reason: { type: string }
    CandidateSnapshot:
      type: object
      required: [id, sourceType, snapshotDate, originalCompanyName, importedAt, data]
      properties:
        id: { type: number }
        sourceType: { type: string, enum: [dnb_bisnode, sales_navigator, manual] }
        sourceRowId: { type: ["string", "null"] }
        snapshotDate: { type: string, format: date }
        originalCompanyName: { type: string }
        importedAt: { type: string, format: date-time }
        data:
          type: object
          required: [fields]
          properties:
            employees: { type: ["number", "null"] }
            revenue: { type: ["string", "null"] }
            owner: { type: ["string", "null"] }
            personName: { type: ["string", "null"] }
            roleTitle: { type: ["string", "null"] }
            profileUrl: { type: ["string", "null"] }
            fields:
              type: object
              additionalProperties: { type: string }
    CandidateChange:
      type: object
      required: [kind, label, detail]
      properties:
        kind: { type: string, enum: [employee_change, relevant_role, source_refresh] }
        label: { type: string }
        detail: { type: string }
    Candidate:
      type: object
      required: [id, companyName, matchStatus, relevanceStatus, relevanceSource, monitoringStatus, priorityScore, priorityReasons, snapshots, changes, evidence, createdAt, updatedAt]
      properties:
        id: { type: number }
        companyName: { type: string }
        organizationNumber: { type: ["string", "null"] }
        domain: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        employees: { type: ["number", "null"] }
        matchStatus: { type: string, enum: [new, exact, domain_match, name_match, needs_review] }
        relevanceStatus: { type: string, enum: [relevant, possible, not_relevant, needs_review] }
        relevanceReason: { type: ["string", "null"] }
        relevanceSource: { type: string, enum: [system, manual] }
        monitoringStatus: { type: string, enum: [monitoring, not_monitoring] }
        monitoringReason: { type: ["string", "null"] }
        priorityScore: { type: number }
        priorityReasons:
          type: array
          items: { type: string }
        lastAnalyzedAt: { type: ["string", "null"], format: date-time }
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/CandidateSnapshot" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/CandidateChange" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CandidateImportRecord:
      type: object
      required: [companyName]
      properties:
        sourceRowId: { type: ["string", "null"] }
        companyName: { type: string, minLength: 2 }
        organizationNumber: { type: ["string", "null"] }
        domain: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        employees: { type: ["number", "null"] }
        revenue: { type: ["string", "null"] }
        owner: { type: ["string", "null"] }
        personName: { type: ["string", "null"] }
        roleTitle: { type: ["string", "null"] }
        profileUrl: { type: ["string", "null"] }
        fields:
          type: object
          additionalProperties: { type: string }
    CandidateImportInput:
      type: object
      required: [sourceType, snapshotDate, records]
      properties:
        sourceType: { type: string, enum: [dnb_bisnode, sales_navigator, manual] }
        snapshotDate: { type: string, format: date }
        records:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CandidateImportRecord" }
    CandidateImportResult:
      type: object
      required: [created, matched, needsReview, skipped, warnings]
      properties:
        created: { type: number }
        matched: { type: number }
        needsReview: { type: number }
        skipped: { type: number }
        warnings:
          type: array
          items: { type: string }
    CandidateBatchInput:
      type: object
      properties:
        scope: { type: string, enum: [universe, relevant, monitoring], default: monitoring }
        limit: { type: number, minimum: 1, maximum: 100 }
    CandidateRelevanceInput:
      type: object
      required: [relevanceStatus]
      properties:
        relevanceStatus: { type: string, enum: [relevant, possible, not_relevant, needs_review] }
        reason: { type: ["string", "null"] }
    CandidateMonitoringInput:
      type: object
      required: [monitoringStatus]
      properties:
        monitoringStatus: { type: string, enum: [monitoring, not_monitoring] }
        reason: { type: ["string", "null"] }
    CandidateAnalysisBatch:
      type: object
      required: [id, requestedCount, selectedCount, criteria, createdAt, candidates]
      properties:
        id: { type: number }
        requestedCount: { type: number }
        selectedCount: { type: number }
        criteria: { type: string }
        createdAt: { type: string, format: date-time }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }